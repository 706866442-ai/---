; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink

[platformio]
core_dir = D:/car-data/pio
; Keep generated objects and linker outputs out of the Chinese project path.
; The STM32 linker used by this toolchain can fail to create firmware.map
; when any part of its output path contains non-ASCII characters.
build_dir = D:/car-data/build/stm32_blink_build
